[package]
name = "gui"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "SHCEcoSim"
path = "src/main.rs"

[dependencies]
simulator = { path = "../simulator" }
slint = "1"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
slint-build = "1"
winresource = "0.1"
